<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive DOM Demo</title>
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2ecc71;
            --background: #ffffff;
            --text-color: #2c3e50;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        .dark-theme {
            --primary-color: #5dade2;
            --secondary-color: #52be80;
            --background: #2c3e50;
            --text-color: #ecf0f1;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--background);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        #dynamicText {
            font-size: 1.5rem;
            margin: 1rem 0;
            padding: 1rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .highlight {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            transform: scale(1.02);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.8rem 1.2rem;
            border: none;
            border-radius: 6px;
            background: var(--primary-color);
            color: white;
            cursor: pointer;
            font-weight: 500;
            box-shadow: 0 2px 4px var(--shadow);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px var(--shadow);
        }

        #elementContainer {
            display: grid;
            gap: 1rem;
            margin-top: 2rem;
        }

        .dynamic-element {
            background: var(--background);
            padding: 1rem;
            border-radius: 6px;
            box-shadow: 0 2px 8px var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 1;
            transform: translateX(0);
            transition: all 0.3s ease;
        }

        .remove-btn {
            background: transparent;
            color: var(--text-color);
            padding: 0.4rem 0.8rem;
            box-shadow: none;
        }

        .remove-btn:hover {
            color: #e74c3c;
            transform: scale(1.1);
        }

        #counter {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        #themeToggle {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: transparent;
            color: var(--text-color);
            box-shadow: none;
        }

        @media (max-width: 600px) {
            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <button id="themeToggle">🌓 Toggle Theme</button>
    <div class="container">
        <header>
            <h1>Black Universal DOM Demo</h1>
            <p id="dynamicText"></p>
        </header>

        <div class="controls">
            <button id="changeTextBtn">Change Text</button>
            <button id="toggleStyleBtn">Toggle Highlight</button>
            <button id="addElementBtn">Add Element</button>
            <button id="clearAllBtn">Clear All</button>
        </div>

        <div id="elementContainer"></div>
        <p id="counter">Elements created: 0</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
